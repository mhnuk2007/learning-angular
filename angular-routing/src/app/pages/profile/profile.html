<h1>Profile Page</h1>

<h2>Route Param:</h2>
@if(routeParamId()) {
  <p>User ID: {{ routeParamId() }}</p>
} @else {
  <p>No Route ID provided</p>
}

<h2>Query Params:</h2>
<ul>
  @for (key of objectKeys(queryParamsData()); track key) {
    <li>{{ key }} : {{ queryParamsData()[key] }}</li>
  }
</ul>

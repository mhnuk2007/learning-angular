<input
  type="text"
  placeholder="Enter your name..."
  [value]="name()"
  (input)="name.set($event.target.value)"
/>
<input
  type="email"
  [value]="email()"
  (input)="email.set($event.target.value)"
  placeholder="Enter your email..."
  
/>

<button (click)="submitForm()">{{editingUpdateId() ? 'Update' : 'Submit'}}</button>
<h3>User List</h3>
<ul>
  @for(user of users(); track user.id){
  <li>
    {{ user.id }} - <strong>{{ user.name }}</strong> - ({{ user.email }}) - {{ user.isActive }}
    <button (click)="editUser(user)">update</button>
  </li>

  }
</ul>

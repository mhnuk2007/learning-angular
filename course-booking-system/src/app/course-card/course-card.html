<div class="course-card">
  <img
    class="course-image"
    [src]="course.imgUrl"
    alt="{{ course.name }} logo"
  />

  <div class="course-content">
    <h3>{{ course.name }}</h3>
    <p class="description">{{ course.description }}</p>

    <div class="meta">
      <span class="price">{{ course.price | currency: 'USD' }}</span>
      <span class="date">{{ course.date | date:'shortDate' }}</span>
    </div>

    @if(course.price < 50){
      <div class="special-offer-badge">Special Offer!</div>
    }
    @if(course.onSale){
      <div class="on-sale-badge">On Sale!</div>
    }

    <span [hidden]="!course.soldOut" class="sold-out">
      Sold Out
    </span>

    <button
      class="button"
      (click)="onBookCourse()"
      [disabled]="course.soldOut"
    >
      Book Course
    </button>
  </div>
</div>

<div class="course-card">

  <!-- Left: Course Logo -->
  <div class="image-wrapper">
    <img
      class="course-image"
      [src]="course.imgUrl"
      alt="{{ course.name }} logo"
    />
  </div>

  <!-- Right: Course Details -->
  <div class="course-content">

    <!-- Title + Badges -->
    <div class="header">
      <h3 class="course-title">{{ course.name }}</h3>

      <div class="badges">
        @if (course.price < 50) {
          <span class="badge special-offer-badge">Special Offer</span>
        }
        @if (course.onSale) {
          <span class="badge on-sale-badge">On Sale</span>
        }
        @if (course.soldOut) {
          <span class="badge sold-out">Sold Out</span>
        }
      </div>
    </div>

    <!-- Description -->
    <p class="description">{{ course.description }}</p>

    <!-- Meta -->
    <div class="meta">
      <span class="price">{{ course.price | currency: 'USD' }}</span>
      <span class="date">{{ course.date | date:'shortDate' }}</span>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button
        class="button secondary"
        (click)="addToWishList()"
        [disabled]="course.soldOut">
        Add to Wishlist
      </button>

      <button
        class="button primary"
        (click)="onBookCourse()"
        [disabled]="course.soldOut">
        Book Course
      </button>
    </div>

  </div>
</div>

<div class="course-card">
  <div class="image-wrapper">
    <img [src]="course.imgUrl" [alt]="course.title + ' logo'" class="course-image"/>
  </div>

  <div class="course-content">
    <div class="header">
      <h3 class="course-title">{{ course.title }}</h3>
      <div class="badges">
        @if(course.price < 50){
          <span class="badge special-offer-badge">Special Offer</span>
        }
        @if(course.onSale){
          <span class="badge on-sale-badge">On Sale</span>
        }
        @if(course.soldOut){
          <span class="badge sold-out">Sold Out</span>
        }
      </div>
    </div>

    <p class="description">{{ course.description }}</p>

    <div class="meta">
      <span class="price">{{ course.price | currency: 'USD' }}</span>
      <span class="date">{{ course.date | date:'shortDate' }}</span>
    </div>

    <div class="actions">
  <button class="button secondary"
          (click)="addToWishList()"
          [disabled]="course.soldOut">
    Add to Wishlist
  </button>

  <button class="button primary"
          (click)="onBookCourse()"
          [disabled]="course.soldOut">
    Book Course
  </button>

  <!-- Add this button -->
  <button class="button tertiary"
          (click)="goToDetails()">
    View Details
  </button>
</div>
  </div>
</div>

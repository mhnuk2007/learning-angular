<h1>Application</h1>
@if(userService.user()){
  <p>Welcome {{userService.user()!.name}}</p>
  @if(userService.isAdmin()){
    <p>Admin Access</p>
  }
  <button (click)="userService.logout()">Logout</button>
}@else{
  <button (click)="userService.login('Honey Chauhan', 'admin')">Login</button>
}

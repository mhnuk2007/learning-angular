<h2>Template driven form with signals</h2>

<input
[(ngModel)]="name"
(ngModelChange)="name.set($event)"
placeholder="Enter your name..."
/>
<br><br>
<input
[(ngModel)]="email"
(ngModelChange)="email.set($event)"
placeholder="Enter your email..."
/>
<br><br>
<button (click)="submitForm()">Submit</button>

<p>Name: {{ name() }}</p>
<p>Email: {{ email() }}</p>
